name: Market Pro Public Release Runner Check
on:
  push:
    paths:
      - '.github/workflows/marketpro-public-runner-check.yml'
permissions:
  contents: read
jobs:
  public-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public release runner available
        run: |
          set -euo pipefail
          echo 'PASS: Public GitHub Actions runner is working.'
          echo 'Market Pro release runner diagnostic v2: no secrets, no release, no APK.'
          test "${GITHUB_REPOSITORY}" = "Shanawebs/marketpro-apk-releases"
